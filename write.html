<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 독서기록 작성 - 독서야 놀자!</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cg-auth.css">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-sizing: border-box;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .rating-input label {
            display: inline-block;
            margin-right: 10px;
        }
        .rating-input input[type="radio"] {
            margin-right: 5px;
        }
        .prompt-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-top: 20px;
        }
        .prompt-container h3 {
            color: var(--secondary-color);
            margin-top: 0;
        }
        .prompt-list {
            list-style: none;
            padding: 0;
        }
        .prompt-list li {
            background-color: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .prompt-list li:hover {
            background-color: #f0f0f0;
        }
        .form-actions {
            margin-top: 30px;
            text-align: right;
        }
        .form-actions .btn {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">📚 독서야 놀자!</div>
            <nav id="main-nav"></nav>
            <div id="cg-auth-slot"></div>
        </div>
    </header>

    <main>
        <section class="container">
            <h1 id="page-title">새 독서기록 작성</h1>
            <div id="auth-required" style="display: none;">
                <p>기록을 작성하려면 로그인해야 합니다. <button class="btn btn-primary" data-cg="login">Google로 로그인</button></p>
            </div>
            <div id="write-content" style="display: none;">
                <form id="record-form">
                    <input type="hidden" id="record-id">
                    <div class="form-group">
                        <label for="title">책 제목 <span style="color: red;">*</span></label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">저자</label>
                        <input type="text" id="author">
                    </div>
                    <div class="form-group">
                        <label for="publisher">출판사</label>
                        <input type="text" id="publisher">
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn">
                    </div>
                    <div class="form-group">
                        <label for="category">카테고리</label>
                        <select id="category">
                            <!-- Options will be loaded from book-data.js -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reading-status">독서 상태 <span style="color: red;">*</span></label>
                        <select id="reading-status" required>
                            <!-- Options will be loaded from book-data.js -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="started-at">시작일</label>
                        <input type="date" id="started-at">
                    </div>
                    <div class="form-group">
                        <label for="finished-at">완료일</label>
                        <input type="date" id="finished-at">
                    </div>
                    <div class="form-group">
                        <label for="reading-date">읽은 날짜</label>
                        <input type="date" id="reading-date">
                    </div>
                    <div class="form-group">
                        <label>별점</label>
                        <div class="rating-input">
                            <input type="radio" id="rating-5" name="rating" value="5"><label for="rating-5">⭐⭐⭐⭐⭐</label>
                            <input type="radio" id="rating-4" name="rating" value="4"><label for="rating-4">⭐⭐⭐⭐</label>
                            <input type="radio" id="rating-3" name="rating" value="3"><label for="rating-3">⭐⭐⭐</label>
                            <input type="radio" id="rating-2" name="rating" value="2"><label for="rating-2">⭐⭐</label>
                            <input type="radio" id="rating-1" name="rating" value="1"><label for="rating-1">⭐</label>
                            <input type="radio" id="rating-0" name="rating" value="" checked><label for="rating-0">없음</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="one-line-review">한 줄 느낌</label>
                        <input type="text" id="one-line-review">
                    </div>
                    <div class="form-group">
                        <label for="summary">줄거리 요약</label>
                        <textarea id="summary"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 줄거리 요약</h3>
                            <ul id="summary-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="memorable-sentence">기억에 남는 문장</label>
                        <textarea id="memorable-sentence"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 기억에 남는 문장</h3>
                            <ul id="memorable-sentence-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="feeling">느낀 점</label>
                        <textarea id="feeling"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 느낀 점</h3>
                            <ul id="feeling-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="learned">배운 점</label>
                        <textarea id="learned"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 배운 점</h3>
                            <ul id="learned-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="action-plan">나에게 적용할 점</label>
                        <textarea id="action-plan"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 나에게 적용할 점</h3>
                            <ul id="action-plan-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="favorite-character">좋아하는 인물</label>
                        <input type="text" id="favorite-character">
                        <div class="prompt-container">
                            <h3>작성 가이드: 좋아하는 인물</h3>
                            <ul id="favorite-character-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="question-after-reading">읽고 난 뒤 생긴 질문</label>
                        <textarea id="question-after-reading"></textarea>
                        <div class="prompt-container">
                            <h3>작성 가이드: 읽고 난 뒤 생긴 질문</h3>
                            <ul id="question-prompts" class="prompt-list"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="visibility">공개 여부 <span style="color: red;">*</span></label>
                        <select id="visibility" required>
                            <option value="private">비공개 (나만 보기)</option>
                            <option value="public">공개 (모두에게 공개)</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" id="temp-save-btn" class="btn btn-secondary">임시 저장</button>
                        <button type="button" id="cancel-btn" class="btn btn-tertiary">취소</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 독서야 놀자!</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/nav.js"></script>
    <script defer src="js/cg-auth.js" data-service="book" data-mount="#cg-auth-slot"></script>
    <script defer src="js/book-data.js"></script>
    <script defer src="js/prompts.js"></script>
    <script defer src="js/write.js"></script>
</body>
</html>
